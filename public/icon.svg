<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Sleek dark background container with subtle gold border for maximum tab contrast -->
  <rect width="128" height="128" rx="28" fill="#0E1016"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.5"/>
  
  <g transform="translate(14, 4)">
    <!-- Vertical stem with rounded bottom -->
    <path
      d="M22 18 C22 13 26 9 31 9 H38 V92 C38 97 34 101 29 101 C25 101 22 97 22 92 V18 Z"
      fill="#F3EFE6"
    />
    <!-- Bottom gold dot / seal below stem -->
    <circle cx="30" cy="112" r="5.5" fill="#D4AF37" />
    <!-- Folded paper document bowl -->
    <path
      d="M38 9 H72 L86 23 V76 C86 82 81 87 75 87 H38 V9 Z"
      fill="#F3EFE6"
    />
    <!-- Folded dog-ear corner triangle cutout -->
    <path
      d="M72 9 L86 23 H72 V9 Z"
      fill="#0E1016"
    />
    <path
      d="M72 9 L86 23"
      stroke="#D4AF37"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
