<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pleadings · Post Generator</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--tx:#111;--mut:#6b6b66;--line:#e3e3df;--red:#C4161E;--accent:#5c1d68;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--panel:#1e1e1e;--tx:#f2f2ee;--mut:#a5a59e;--line:#34342f}}
:root[data-theme="dark"]{--bg:#141414;--panel:#1e1e1e;--tx:#f2f2ee;--mut:#a5a59e;--line:#34342f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{max-width:1280px;margin:auto;padding:18px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px}
.top h1 span{color:var(--red)}
.top p{margin:0;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;max-width:1280px;margin:10px auto 0;padding:0 20px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:10px 18px;border-radius:999px;font:600 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:all .15s}
.tabs button:hover{border-color:var(--red);color:var(--red)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
main{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:22px;max-width:1280px;margin:16px auto 40px;padding:0 20px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start}
.ctl label{display:flex;justify-content:space-between;align-items:center;font:600 11px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 5px}
.ctl label:first-child{margin-top:0}
.ctl input,.ctl textarea,.ctl select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--tx);font:14px system-ui,sans-serif}
.ctl textarea{min-height:84px;resize:vertical}
.ctl input[type="checkbox"]{width:auto;margin:0 8px 0 0;cursor:pointer}
.chk-row{display:flex;align-items:center;margin:12px 0 4px;font-size:13px;cursor:pointer;user-select:none;color:var(--tx);font-weight:500}
.hint{font-size:12px;color:var(--mut);margin:12px 0 0;line-height:1.45}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.92}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--line);margin-top:8px}
.btn.alt:hover{background:rgba(0,0,0,.03);border-color:var(--mut)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.warn{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:#fde8e8;color:#8a1016;font-size:13px;line-height:1.4}
.warn.on{display:block}
.ok{margin-top:10px;font-size:12px;color:var(--mut);min-height:16px}
.stage{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;min-width:0}
.cap{font:600 11px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.cap button{border:0;background:none;color:var(--red);font:600 11px system-ui;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;padding:0}
.frame{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 10px 32px rgba(0,0,0,.16);background:#fff}
.frame .pg{position:absolute;left:0;top:0;transform-origin:0 0}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px}
.tpls button{border:1px solid var(--line);background:transparent;color:var(--tx);padding:9px 10px;border-radius:8px;font:600 12px system-ui,sans-serif;cursor:pointer;text-align:left;line-height:1.25;transition:all .15s}
.tpls button:hover{border-color:var(--mut)}
.tpls button small{display:block;font:400 10px system-ui,sans-serif;color:var(--mut);margin-top:2px}
.tpls button.on{border-color:var(--red);background:var(--red);color:#fff}
.tpls button.on small{color:rgba(255,255,255,.85)}

/* Photo Prompts Drawer */
.pcard{background:rgba(196,22,30,.04);border:1px solid rgba(196,22,30,.2);border-radius:10px;margin:14px 0;overflow:hidden}
.pcard-head{padding:11px 13px;font:700 12px system-ui;color:var(--red);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.pcard-body{padding:0 13px 13px;display:none;font-size:12px}
.pcard-body.open{display:block}
.prompt-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:8px}
.prompt-title{font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center;color:var(--tx);margin-bottom:4px}
.prompt-txt{font-size:11px;color:var(--mut);line-height:1.4;margin:0 0 6px;word-break:break-word}
.copy-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;font:600 10px system-ui;color:var(--tx);cursor:pointer}
.copy-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.ext-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ext-links a{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--red);text-decoration:none;padding:4px 8px;border-radius:6px;background:rgba(196,22,30,.08)}
.ext-links a:hover{text-decoration:underline}

/* Presets Bar */
.photo-presets{display:grid;grid-template-columns:repeat(2, 1fr);gap:6px;margin:6px 0 10px}
.preset-btn{border:1px solid var(--line);background:transparent;color:var(--tx);padding:7px 8px;border-radius:6px;font:500 11px system-ui;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset-btn:hover{border-color:var(--red)}
.preset-btn.on{border-color:var(--red);background:rgba(196,22,30,.08);font-weight:700;color:var(--red)}
</style>
</head>
<body>
<div class="top">
  <h1><span>P</span>leadings · Post Generator</h1>
  <p>Editorial Legal Post Studio · Designed for Instagram, LinkedIn & X</p>
</div>
<div class="tabs" id="tabs">
  <button data-t="bn" class="on">Breaking News</button>
  <button data-t="ph">Big Headline + Photo</button>
  <button data-t="cr">Carousel (Rights & Guides)</button>
  <button data-t="rl">Reel Cover (9:16)</button>
</div>
<main>
  <section class="ctl" id="ctl"></section>
  <section class="stage" id="stage"></section>
</main>

function seal(size,verdict){

 const ws=(verdict||'DISPOSED').toUpperCase().split(/\s+/).filter(Boolean).slice(0,3);
 const fs=Math.max(...ws.map(w=>w.length))<=8?34:25;
 const n=ws.length;

}

function resolvePhoto(d, fallbackPreset){
 const pkey = d.preset || 'sc_facade';
 if (pkey === 'custom' && d.photo) return { src: d.photo, isPreset: false };
 if (pkey === 'sc_facade') return { src: PRESET_SC_FACADE, isPreset: true, crop: 'facade' };
 if (pkey === 'sc_dome') return { src: PRESET_SC_DOME, isPreset: true, crop: 'dome' };
 if (pkey === 'scales') return { src: PRESET_SCALES, isPreset: true, crop: 'none' };
 if (pkey === 'emblem') return { src: PRESET_EMBLEM, isPreset: true, crop: 'none' };
 if (d.photo) return { src: d.photo, isPreset: false };
 return { src: fallbackPreset || PRESET_SC_FACADE, isPreset: true, crop: 'facade' };
}

function togglePrompts(){
 promptsOpen = !promptsOpen;
 const pb = $('#prompts-body');
 const pa = $('#prompts-arrow');
 if(pb){ pb.classList.toggle('open', promptsOpen); }
 if(pa){ pa.textContent = promptsOpen ? '▲' : '▼'; }
}

function copyPrompt(btn, text){
 navigator.clipboard.writeText(text).then(()=>{
  const orig = btn.textContent;
  btn.textContent = '✓ Copied!';
  btn.style.background = '#28a745';
  btn.style.color = '#fff';
  btn.style.borderColor = '#28a745';
  setTimeout(()=>{
   btn.textContent = orig;
   btn.style.background = '';
   btn.style.color = '';
   btn.style.borderColor = '';
  }, 2000);
 }).catch(()=>{
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  btn.textContent = '✓ Copied!';
  setTimeout(()=>{ btn.textContent = 'Copy'; }, 2000);
 });
}

function buildCtl(){
 const t=T[cur], at=activeTpl();

  t.templates.map(tp=>'<button type="button" data-tpl="'+tp.id+'" class="'+(tp.id===at.id?'on':'')+'">'+esc(tp.name)+'<small>'+esc(tp.sub)+'</small></button>').join('')+

 // 3. Field controls
 h+=t.fields.map(f=>{

  // Photo preset selector
  if(f[4]==='ps'){

  // Select focus

 h+='<div class="warn" id="warn"></div>';

function render(){

 const bad=[];
 $('#stage').querySelectorAll('.pg').forEach((p,i)=>{
  p.style.transform='scale('+s+')';
  const n=p.querySelector('.in');
  if(n && (n.scrollHeight>n.clientHeight+2||n.scrollWidth>n.clientWidth+2)) bad.push(i+1);
 });
 
 overflow=bad.length>0;
 const wn=$('#warn');
 if(wn){
  wn.classList.toggle('on',overflow);
  wn.textContent=overflow?'Too much text'+(cur==='cr'?' on slide '+bad.join(', '):'')+'. Shorten it so the design stays perfect; download is paused.':'';
 }
 
 ['dl','dl1'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=overflow||busy});
 $('#stage').querySelectorAll('.cap button').forEach(b=>{
  b.disabled=overflow||busy;
  b.onclick=()=>exportOne(+b.dataset.i);
 });
}

const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
async function toPng(html,h){
 const host=document.createElement('div');
 host.style.cssText='position:fixed;left:-20000px;top:0;width:1080px;height:'+h+'px;pointer-events:none';
 host.innerHTML=html;document.body.appendChild(host);
 const node=host.firstElementChild;
 try{
  await document.fonts.ready;
  await Promise.all([...node.querySelectorAll('img')].map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));
  const o={width:1080,height:h,pixelRatio:1,fontEmbedCSS:FONTCSS,cacheBust:false,backgroundColor:'#ffffff'};
  if(isSafari)await htmlToImage.toBlob(node,o);
  const blob=await htmlToImage.toBlob(node,o);
  if(!blob)throw new Error('Empty image');
  return blob;
 }finally{host.remove()}
}

async function saver(){const c=window.claude&&window.claude.use?await window.claude.use('downloads'):null;return c}
function say(m){const o=$('#ok');if(o)o.textContent=m}

async function exportOne(i){
 if(overflow||busy)return;
 busy=true;render();say('Preparing PNG…');
 try{
  const sl=slides(),blob=await toPng(sl[i],T[cur].h),d=await saver();
  const at=activeTpl();
  const nm='Pleadings_'+T[cur].name+'_'+at.id+(cur==='cr'?'_'+String(i+1).padStart(2,'0'):'')+'.png';
  if(!d){
   const u=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=u;
   a.download=nm;
   document.body.appendChild(a);
   a.click();
   a.remove();
   setTimeout(()=>URL.revokeObjectURL(u), 4000);
   say('Downloaded '+nm);
  } else {
   await d.save({filename:nm,data:blob});
   say('Saved '+nm);
  }
 }catch(e){
  console.error(e);
  say(e&&e.code==='declined'?'Download cancelled.':'Could not create the PNG. Please try again.');
 }
 busy=false;render();
}

async function exportZip(){
 if(overflow||busy)return;
 busy=true;render();say('Preparing slides…');
 try{
  const sl=slides(),z=new JSZip();
  const at=activeTpl();
  for(let i=0;i<sl.length;i++){
   say('Rendering slide '+(i+1)+' of '+sl.length+'…');
   z.file('Pleadings_Carousel_'+at.id+'_'+String(i+1).padStart(2,'0')+'.png',await toPng(sl[i],1350));
  }
  const zb=await z.generateAsync({type:'blob'}),d=await saver();
  if(!d){
   const u=URL.createObjectURL(zb);
   const a=document.createElement('a');
   a.href=u;
   a.download='Pleadings_Carousel.zip';
   document.body.appendChild(a);
   a.click();
   a.remove();
   setTimeout(()=>URL.revokeObjectURL(u), 4000);
   say('Downloaded Pleadings_Carousel.zip');
  } else {
   await d.save({filename:'Pleadings_Carousel.zip',data:zb});
   say('Saved Pleadings_Carousel.zip');
  }
 }catch(e){
  console.error(e);
  say(e&&e.code==='declined'?'Download cancelled.':'Could not create the ZIP. Please try again.');
 }
 busy=false;render();
}
